[package]
name = "mre-wry-deadlock"
version = "0.1.0"
description = "MRE: WebView2 deadlock on Windows ARM64 (wry wait_with_pump)"
authors = []
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "devtools", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-process = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-shell = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Vendored forks for ARM64 WebView2 deadlock fix.
# wry fix:   https://github.com/npiesco/wry/tree/fix/deferred-webview2-arm64
# tauri fix: https://github.com/npiesco/tauri/tree/fix/deferred-webview2-creation
[patch.crates-io]
wry = { git = "https://github.com/npiesco/wry.git", branch = "fix/deferred-webview2-arm64" }
tauri = { git = "https://github.com/npiesco/tauri.git", branch = "fix/deferred-webview2-creation" }
tauri-build = { git = "https://github.com/npiesco/tauri.git", branch = "fix/deferred-webview2-creation" }
tauri-runtime-wry = { git = "https://github.com/npiesco/tauri.git", branch = "fix/deferred-webview2-creation" }
tauri-runtime = { git = "https://github.com/npiesco/tauri.git", branch = "fix/deferred-webview2-creation" }
tauri-utils = { git = "https://github.com/npiesco/tauri.git", branch = "fix/deferred-webview2-creation" }
tauri-macros = { git = "https://github.com/npiesco/tauri.git", branch = "fix/deferred-webview2-creation" }
tauri-codegen = { git = "https://github.com/npiesco/tauri.git", branch = "fix/deferred-webview2-creation" }
tauri-plugin = { git = "https://github.com/npiesco/tauri.git", branch = "fix/deferred-webview2-creation" }
